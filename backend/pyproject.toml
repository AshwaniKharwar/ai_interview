[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.114",
    "cartesia>=4.2.0",
    "deepgram-sdk>=7.13.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

